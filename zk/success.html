<!DOCTYPE html>
<html lang="zh-CN">
<head>

<body>
  <div class="loading hide"><div class="mark">ZK</div></div>

  <section class="page-hero">

          </div>

            <a class="btn btn-gold" href="courses.html">查看课程</a>
          </div>
        </div>

  <footer class="footer"></footer>
  <div class="sticky"></div>
  <script src="statics/js/main.js"></script>
